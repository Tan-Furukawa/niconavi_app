name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows / Setup.exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check the build tools
        shell: pwsh
        run: |
          uv --version
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup 6 was not found at: $iscc"
          }
          Write-Host "Inno Setup: $iscc"

      - name: Build the installer
        shell: pwsh
        run: |
          ./packaging/windows/build_windows.ps1 `
            -OutputDirectory (Join-Path $PWD "dist/windows")

      - name: Prepare Windows/Setup.exe
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "dist/windows/NicoNavi-*-Setup-x64.exe" -File)
          if ($setups.Count -ne 1) {
            throw "Expected one installer, found $($setups.Count)."
          }

          New-Item -ItemType Directory -Force -Path "Windows" | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination "Windows/Setup.exe"

          $hash = (Get-FileHash "Windows/Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Setup.exe" | Set-Content "Windows/Setup.exe.sha256" -Encoding ascii

          "### Windows installer" >> $env:GITHUB_STEP_SUMMARY
          "Built ``$($setups[0].Name)`` as ``Windows/Setup.exe``." >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NicoNavi-Windows
          path: Windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
